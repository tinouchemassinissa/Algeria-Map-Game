<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Algeria Wilaya Explorer</title>
    <script>
      window.globalInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.globalInstallPrompt = e;
      });
      // Force kill the stubborn PWA cache that holds Yankee Doodle
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function(boolean) {
              if (boolean) {
                console.log('Successfully unregistered old service worker!');
                window.location.reload();
              }
            });
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <audio id="bg-music" src="/bg_music_v2.mp3" loop></audio>
    <audio id="anthem-audio" src="/dz_anthem_v2.mp3"></audio>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
